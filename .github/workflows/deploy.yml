name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petcare_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: petcare_backend/package-lock.json
      - run: npm ci
      # Prisma 7 không tự sinh client lúc cài, thiếu bước này thì eslint thấy mọi kiểu Prisma là any
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petcare_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: petcare_admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000/api/v1

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petcare_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Hai thứ nằm ngoài Git: file khoá Firebase thay bằng bản giả, assets/mock tạo rỗng
      - run: |
          cp tool/ci/firebase_options_stub.dart lib/firebase_options.dart
          mkdir -p assets/mock
      - run: flutter pub get
      # Thư mục l10n sinh tự động không nằm trong Git nên phải sinh lại trước khi phân tích
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  deploy:
    # Ba job kiểm thử cùng chặn deploy, một mảng đỏ là không lên Railway
    needs: [build, admin, app]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: petcare_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @railway/cli
      - run: railway up --service petcare-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
